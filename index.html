<!doctype html>
<html lang="en">
    <head>
        <script type="application/ld+json">
            {
                "@context": "https://schema.org",
                "@type": "Organization",
                "name": "Trishul Space",
                "url": "https://www.trishulspace.com",
                "logo": "https://www.trishulspace.com/favicon/android-chrome-512x512.png"
            }
        </script>
        <meta charset="UTF-8" />
        <meta
            http-equiv="Content-Security-Policy"
            content="default-src 'self';
                 style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
                 font-src https://fonts.gstatic.com;
                 img-src 'self' data: https://maps.gstatic.com https://maps.googleapis.com;
                 media-src 'self';
                 script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://maps.googleapis.com;
                 worker-src 'self' blob:;
                 connect-src 'self' https://www.gstatic.com ws://localhost:* http://localhost:*;
                 frame-src https://www.google.com https://maps.google.com https://www.youtube.com https://www.youtube-nocookie.com;"
        />

        <meta http-equiv="X-Content-Type-Options" content="nosniff" />
        <!-- Favicons -->
        <link
            rel="icon"
            type="image/png"
            sizes="32x32"
            href="/favicon/favicon-32x32.png"
        />
        <link
            rel="icon"
            type="image/png"
            sizes="16x16"
            href="/favicon/favicon-16x16.png"
        />
        <link
            rel="icon"
            type="image/png"
            sizes="192x192"
            href="/favicon/android-chrome-192x192.png"
        />
        <link
            rel="icon"
            type="image/png"
            sizes="512x512"
            href="/favicon/android-chrome-512x512.png"
        />
        <link rel="shortcut icon" href="/favicon/favicon.ico" />

        <link
            rel="apple-touch-icon"
            sizes="180x180"
            href="/favicon/apple-touch-icon.png"
        />
        <link rel="manifest" href="/favicon/site.webmanifest" />

        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <!-- SEO Meta Tags -->
        <title>Trishul Space</title>
        <meta
            name="description"
            content="Trishul Space is building advanced propulsion systems to power the next generation of space missions. We develop high-efficiency cryogenic rocket engines and custom propulsion solutions, enabling reliable, scalable, and cost-effective access to space."
        />
        <meta
            name="keywords"
            content="rocket engine, Rocket, liquid propulsion, Methalox, LNG LOX, staged combustion, FADEC, space startup, India aerospace, Harpy-1, SSLV"
        />
        <meta name="author" content="Trishul Space" />

        <!-- Open Graph -->
        <meta property="og:title" content="Trishul Space" />
        <meta
            property="og:description"
            content="Indigenous, Efficient, Modular Liquid Rocket Engines for the Next Generation of Launch Vehicles"
        />
        <meta property="og:type" content="website" />
        <meta property="og:url" content="https://www.trishulspace.com" />
        <meta
            property="og:image"
            content="https://www.trishulspace.com/Trishul-icon-2.png"
        />
        <meta property="og:image:type" content="image/png" />
        <meta property="og:image:width" content="1024" />
        <meta property="og:image:height" content="1024" />

        <!-- Twitter -->
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="Trishul Space" />
        <meta
            name="twitter:description"
            content="Indigenous, Efficient, Modular Liquid Rocket Engines for the Next Generation of Launch Vehicles"
        />
        <meta
            name="twitter:image"
            content="https://www.trishulspace.com/Trishul-icon-2.png"
        />

        <!-- Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Play:wght@400;700&family=Rajdhani:wght@400;500;600;700&display=swap"
            rel="stylesheet"
        />
    </head>

    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
